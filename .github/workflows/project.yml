name: Limb application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      RTB_PURE_WHEEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest ruff
      - run: ruff check examples/limb_analyzer
      - run: python -m pytest examples/limb_analyzer/test_analysis.py -q
      - run: python -m examples.limb_analyzer.analyze --output /tmp/limb-results
